[profile.default]
# --- Paths ---
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"

# --- Compiler ---
solc = "0.8.27"

# Set to "cancun" so OpenZeppelin contracts using `mcopy` compile successfully.
evm_version = "cancun"

optimizer = true
optimizer_runs = 200
via_ir = false

# --- Output ---
build_info = true
extra_output = ["storageLayout"]

# --- Permissions for scripts ---
fs_permissions = [{ access = "read", path = "./" }]

# --- Testing ---
[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50

# --- Formatting ---
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# --- RPC endpoints ---
[rpc_endpoints]
mainnet = "${RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
amoy = "${AMOY_RPC_URL}"

# --- Etherscan / Block Explorer Verification ---
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
polygon = { key = "${POLYGONSCAN_API_KEY}" }
amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api" }